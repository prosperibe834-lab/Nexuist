<!DOCTYPE html>
<html>
<head>
    <title>Test Balance Update</title>
</head>
<body>
    <h1>Test Balance Update API</h1>
    <p>This page helps test the balance update endpoint.</p>
    
    <div>
        <h2>Manual Test</h2>
        <form id="testForm">
            <label>User ID: <input type="number" id="userId" value="1" required></label><br>
            <label>New Balance: <input type="number" id="newBalance" value="5000" step="0.01" required></label><br>
            <label>Crypto Balance: <input type="text" id="newCrypto" value="2.5 BTC"></label><br>
            <button type="button" onclick="testUpdate()">Send Update Request</button>
        </form>
        <pre id="response"></pre>
    </div>

    <script>
        async function testUpdate() {
            const userId = document.getElementById('userId').value;
            const newBalance = document.getElementById('newBalance').value;
            const newCrypto = document.getElementById('newCrypto').value;
            
            const responseDiv = document.getElementById('response');
            responseDiv.textContent = 'Sending request...';
            
            try {
                const response = await fetch(`/users/${userId}/balance`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': 'test' // In real app, get from meta tag
                    },
                    body: JSON.stringify({
                        balance: parseFloat(newBalance),
                        crypto_balance: newCrypto
                    })
                });
                
                console.log('Response Status:', response.status);
                console.log('Response OK:', response.ok);
                
                const text = await response.text();
                responseDiv.textContent = `Status: ${response.status}\n\nResponse:\n${text}`;
                
                if (response.ok) {
                    const data = JSON.parse(text);
                    responseDiv.textContent = `SUCCESS:\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                responseDiv.textContent = `ERROR: ${error.message}\n\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
