<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexuist Security Ring - Session Recovery Trigger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/forgot.css">
</head>

<body>

    <div id="forgot-preloader" class="gate-preloader">
        <div class="loader-box">
            <i class='bx bx-cube-alt loader-icon'></i>
            <span class="loader-text">PREPARING RECOVERY SIGNAL MATRIX...</span>
        </div>
    </div>

    <div class="theme-anchor" id="theme-toggle"><i class='bx bx-moon'></i></div>

    <div class="viewport-wrapper">
        <div class="auth-card">
            <div class="card-header">
                <div class="brand-logo"><i class='bx bx-radar'></i></div>
                <h2>Recover Clearance Node</h2>
                <p>Provide your declared administrative email matrix routing key to broadcast an outbound verification
                    OTP token.</p>
            </div>

            <form id="forgot-form" novalidate>
                <div class="form-group">
                    <label for="recovery-email">Target Profile Email Address</label>
                    <div class="input-wrapper">
                        <i class='bx bx-envelope'></i>
                        <input type="email" id="recovery-email" placeholder="name@nexuist.com" required>
                    </div>
                    <span class="error-msg">Valid profile identification parameter tracking key needed</span>
                </div>

                <button type="submit" class="submit-btn" id="btn-forgot">
                    <i class='bx bx-broadcast'></i> Dispatch One-Time Security Token
                </button>
            </form>

            <div class="card-footer">
                <p>Remembered authorization credentials? <a href="admin-login.html">Return to Gateway</a></p>
            </div>
        </div>
    </div>

    <script src="./js/forgot.js"></script>
</body>

</html>
